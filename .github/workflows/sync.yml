name: Untis Sync

on:
  schedule:
    # UTC. Odd minutes on purpose: GitHub delays jobs at the top of the hour.
    - cron: '17 4 * * 1-5'
    - cron: '43 10 * * 1-5'
    - cron: '23 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: untis-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          UNTIS_SERVER: kas-bc.webuntis.com   # from your Untis login URL
          UNTIS_SCHOOL: kas-bc             # value after ?school=
          UNTIS_USERNAME: ${{ secrets.UNTIS_USERNAME }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          UNTIS_CLASS: ${{ secrets.UNTIS_CLASS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
